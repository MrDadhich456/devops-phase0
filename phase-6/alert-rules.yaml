apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: my-alerts
  namespace: monitoring
spec:
  groups:
  - name: example
    rules:
    - alert: HighCPU
      expr: sum(rate(container_cpu_usage_seconds_total[5m])) > 0.5
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: 'High CPU detected'
